<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#12140f" />
  <title>MapMyApps</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg:#12140f; --panel:#1c1f18; --line:#31362b; --text:#f3f1e7; --muted:#a7ab9c; --accent:#e2a54a; --ink:#1a1408; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #map { position:fixed; inset:0; background:#cfcaba; }
    .top { position:fixed; top:env(safe-area-inset-top); left:0; right:0; z-index:500; display:flex; gap:8px; align-items:center; padding:10px 12px 0; }
    .brand, .chip, .iconbtn { background:rgba(18,20,15,.92); border:1px solid var(--line); color:var(--text); border-radius:999px; }
    .brand { padding:8px 12px; font-weight:700; }
    .brand span { color:var(--accent); }
    .chip, .iconbtn { padding:8px 12px; font:inherit; }
    select.chip { max-width:46vw; }
    .iconbtn { width:40px; height:40px; padding:0; }
    .sheet { position:fixed; left:0; right:0; bottom:0; z-index:600; background:var(--panel); border-top:1px solid var(--line); border-radius:18px 18px 0 0; padding:8px 14px calc(14px + env(safe-area-inset-bottom)); max-height:46vh; overflow:auto; }
    .grab { width:42px; height:4px; border-radius:4px; background:var(--line); margin:2px auto 10px; }
    .row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    h1 { font-size:18px; margin:0; }
    .muted { color:var(--muted); font-size:13px; }
    .place { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
    .place button { font:inherit; color:inherit; background:none; border:0; text-align:left; padding:0; }
    .actions { display:flex; gap:6px; }
    .actions a, .actions button, .primary, .ghost { font:inherit; border-radius:10px; padding:8px 10px; text-decoration:none; border:1px solid var(--line); color:var(--text); background:#262a20; }
    .primary { background:var(--accent); color:var(--ink); border-color:transparent; font-weight:700; }
    .ghost { background:transparent; }
    .modal { position:fixed; inset:0; z-index:800; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; }
    .card { width:min(560px,100%); background:var(--panel); border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
    label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
    input, textarea { width:100%; font:inherit; color:var(--text); background:#12140f; border:1px solid var(--line); border-radius:10px; padding:10px; }
    .results button { display:block; width:100%; text-align:left; margin-top:6px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="top">
    <div class="brand">Map<span>My</span>Apps v4</div>
    <select id="tripFilter" class="chip" aria-label="Trip"></select>
    <button id="addBtn" class="iconbtn" aria-label="Add place">+</button>
  </div>
  <section class="sheet">
    <div class="grab"></div>
    <div class="row">
      <div>
        <h1 id="sheetTitle">Someday</h1>
        <div class="muted" id="sheetCount">No places yet</div>
      </div>
      <div class="actions">
        <button id="pasteBtn" class="primary">Paste</button>
        <button id="routeBtn" class="ghost">Route</button>
      </div>
    </div>
    <div id="list"></div>
  </section>
  <div id="modal" class="modal hidden">
    <form class="card" id="form">
      <div class="row"><h1>Save a place</h1><button type="button" id="closeModal" class="ghost">Close</button></div>
      <p class="muted" id="sourceLine"></p>
      <label for="query">Place</label>
      <input id="query" placeholder="Search a restaurant, park, town" autocomplete="off" />
      <div id="results" class="results"></div>
      <label for="note">Note</label>
      <textarea id="note" rows="2" placeholder="Why you saved it"></textarea>
      <label for="tripName">List</label>
      <input id="tripName" value="Someday" />
      <div class="row" style="margin-top:12px"><button class="primary" type="submit">Save pin</button></div>
    </form>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const KEY = "mapmyapps.v1";
    const home = [35.7826, -80.8873];
    const state = load();
    const map = L.map("map", { zoomControl: false }).setView(home, 11);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "OpenStreetMap", maxZoom: 19 }).addTo(map);
    L.control.zoom({ position: "bottomright" }).addTo(map);
    let layer = L.layerGroup().addTo(map);
    let picked = null;
    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || { places: [], trips: ["Someday"] }; }
      catch { return { places: [], trips: ["Someday"] }; }
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function uid() { return Math.random().toString(36).slice(2, 9); }
    function trips() {
      const names = new Set(["Someday", ...state.trips, ...state.places.map(p => p.trip || "Someday")]);
      state.trips = [...names];
      return state.trips;
    }
    function renderTrips() {
      const sel = document.getElementById("tripFilter");
      const current = sel.value || "All";
      sel.innerHTML = "<option>All</option>" + trips().map(t => "<option>" + t + "</option>").join("");
      sel.value = [...sel.options].some(o => o.value === current) ? current : "All";
    }
    function visible() {
      const trip = document.getElementById("tripFilter").value;
      return state.places.filter(p => trip === "All" || (p.trip || "Someday") === trip);
    }
    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = String(s == null ? "" : s);
      return d.innerHTML;
    }
    function navUrl(p) {
      return "https://maps.apple.com/directions?destination=" + p.lat + "," + p.lng + "&mode=driving";
    }
    function render() {
      renderTrips();
      const items = visible();
      document.getElementById("sheetTitle").textContent = document.getElementById("tripFilter").value;
      document.getElementById("sheetCount").textContent = items.length ? items.length + " places" : "Copy a link, then Paste";
      layer.clearLayers();
      items.forEach(p => {
        const marker = L.circleMarker([p.lat, p.lng], { radius: 8, color: "#e2a54a", fillColor: "#e2a54a", fillOpacity: 0.95, weight: 2 });
        marker.bindPopup("<b>" + escapeHtml(p.name) + "</b>");
        marker.addTo(layer);
      });
      if (items.length) map.fitBounds(L.latLngBounds(items.map(p => [p.lat, p.lng])).pad(0.3));
      document.getElementById("list").innerHTML = items.map(p =>
        "<div class=\"place\"><button data-focus=\"" + p.id + "\"><strong>" + escapeHtml(p.name) + "</strong><div class=\"muted\">" + escapeHtml(p.address || "") + "</div></button><div class=\"actions\">" +
        (p.source ? "<a href=\"" + p.source + "\" target=\"_blank\" rel=\"noopener\">Post</a>" : "") +
        "<a href=\"" + navUrl(p) + "\">Go</a><button data-del=\"" + p.id + "\">Del</button></div></div>"
      ).join("") || "<p class=\"muted\">Copy a post link, come back here, tap Paste.</p>";
    }
    async function searchPlaces(q) {
      const res = await fetch("https://photon.komoot.io/api/?q=" + encodeURIComponent(q) + "&limit=5");
      const data = await res.json();
      return (data.features || []).map(f => ({
        name: f.properties.name || q,
        address: [f.properties.street, f.properties.city, f.properties.state, f.properties.country].filter(Boolean).join(", "),
        lat: f.geometry.coordinates[1],
        lng: f.geometry.coordinates[0]
      }));
    }
    function openModal(prefill) {
      picked = null;
      document.getElementById("modal").classList.remove("hidden");
      document.getElementById("query").value = prefill.name || "";
      document.getElementById("note").value = "";
      document.getElementById("tripName").value = document.getElementById("tripFilter").value === "All" ? "Someday" : document.getElementById("tripFilter").value;
      document.getElementById("sourceLine").textContent = prefill.source || "Search to drop a pin.";
      document.getElementById("form").dataset.source = prefill.source || "";
      document.getElementById("results").innerHTML = "";
    }
    document.getElementById("query").addEventListener("input", () => {
      clearTimeout(window.__t);
      window.__t = setTimeout(async () => {
        const q = document.getElementById("query").value.trim();
        const box = document.getElementById("results");
        if (q.length < 2) { box.innerHTML = ""; return; }
        box.innerHTML = "<p class=\"muted\">Searching</p>";
        try {
          const hits = await searchPlaces(q);
          box._hits = hits;
          box.innerHTML = hits.map((h, i) => "<button type=\"button\" data-hit=\"" + i + "\">" + escapeHtml(h.name) + "<div class=\"muted\">" + escapeHtml(h.address) + "</div></button>").join("") || "<p class=\"muted\">No match. Add the city.</p>";
        } catch { box.innerHTML = "<p class=\"muted\">Search failed.</p>"; }
      }, 250);
    });
    document.getElementById("results").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-hit]");
      if (!btn) return;
      picked = document.getElementById("results")._hits[Number(btn.dataset.hit)];
      document.getElementById("query").value = picked.name;
      document.getElementById("results").innerHTML = "<p class=\"muted\">Pinned: " + escapeHtml(picked.address) + "</p>";
    });
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!picked) { alert("Pick a search result."); return; }
      const trip = document.getElementById("tripName").value.trim() || "Someday";
      state.places.push({ id: uid(), name: picked.name, address: picked.address, lat: picked.lat, lng: picked.lng, note: document.getElementById("note").value.trim(), trip, source: document.getElementById("form").dataset.source || "", created: Date.now() });
      if (!state.trips.includes(trip)) state.trips.push(trip);
      save();
      document.getElementById("modal").classList.add("hidden");
      render();
    });
    document.getElementById("closeModal").onclick = () => document.getElementById("modal").classList.add("hidden");
    document.getElementById("addBtn").onclick = () => openModal({});
    document.getElementById("pasteBtn").onclick = async () => {
      let raw = "";
      try { raw = await navigator.clipboard.readText(); } catch (e) { raw = ""; }
      if (!raw) { alert("Copy the post link first, then tap Paste."); return; }
      const urlMatch = raw.match(/https?:\/\/\S+/);
      const source = urlMatch ? urlMatch[0] : raw;
      const name = raw.replace(source, "").replace(/https?:\/\/\S+/g, "").trim();
      openModal({ source, name });
    };
    document.getElementById("tripFilter").onchange = render;
    document.getElementById("list").onclick = (e) => {
      const del = e.target.closest("[data-del]");
      const focus = e.target.closest("[data-focus]");
      if (del) { state.places = state.places.filter(p => p.id !== del.dataset.del); save(); render(); }
      if (focus) { const p = state.places.find(x => x.id === focus.dataset.focus); if (p) map.setView([p.lat, p.lng], 14); }
    };
    document.getElementById("routeBtn").onclick = () => {
      const items = visible();
      if (!items.length) { alert("Add a place first."); return; }
      const last = items[items.length - 1];
      const stops = items.slice(0, -1).map(p => p.lat + "," + p.lng).join("+to:");
      location.href = "https://maps.apple.com/?saddr=Current+Location&daddr=" + (stops ? stops + "+to:" : "") + last.lat + "," + last.lng + "&dirflg=d";
    };
    render();
  </script>
</body>
</html>
