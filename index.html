<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#12140f" />
  <title>MapMyApps</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg:#12140f; --panel:#1c1f18; --line:#31362b; --text:#f3f1e7; --muted:#a7ab9c; --accent:#e2a54a; --ink:#1a1408; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { position:sticky; top:0; z-index:5; background:rgba(18,20,15,.94); padding:calc(12px + env(safe-area-inset-top)) 14px 12px; border-bottom:1px solid var(--line); }
    .row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    h1 { font-size:22px; margin:0; }
    h1 span { color:var(--accent); }
    .muted { color:var(--muted); font-size:13px; }
    .tools { display:flex; gap:8px; margin-top:12px; }
    select, button, a.btn { font:inherit; color:var(--text); background:#262a20; border:1px solid var(--line); border-radius:12px; padding:10px 12px; text-decoration:none; }
    select { flex:1; }
    .primary { background:var(--accent); color:var(--ink); border-color:transparent; font-weight:700; }
    main { padding:8px 14px calc(24px + env(safe-area-inset-bottom)); }
    .place { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:10px; }
    .place h2 { font-size:17px; margin:0 0 4px; }
    .meta { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .modal, #mapScreen { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; }
    #mapScreen { display:block; background:#cfcaba; }
    .card { width:min(560px,100%); background:var(--panel); border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
    label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
    input, textarea { width:100%; font:inherit; color:var(--text); background:#12140f; border:1px solid var(--line); border-radius:10px; padding:10px; }
    .results button { display:block; width:100%; text-align:left; margin-top:6px; }
    .hidden { display:none !important; }
    #map { position:absolute; inset:0; }
    .mapbar { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:12px; right:12px; z-index:500; display:flex; gap:8px; }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <div>
        <h1>Map<span>My</span>Apps</h1>
        <div class="muted" id="count">Your places</div>
      </div>
      <button id="mapBtn">Map</button>
    </div>
    <div class="tools">
      <select id="tripFilter" aria-label="List"></select>
      <button id="pasteBtn" class="primary">Paste</button>
      <button id="addBtn">Add</button>
    </div>
  </header>
  <main id="list"></main>
  <div id="modal" class="modal hidden">
    <form class="card" id="form">
      <div class="row"><h1>Save a place</h1><button type="button" id="closeModal">Close</button></div>
      <p class="muted" id="sourceLine"></p>
      <label for="query">Place</label>
      <input id="query" placeholder="Search a restaurant, park, town" autocomplete="off" />
      <div id="results" class="results"></div>
      <label for="note">Note</label>
      <textarea id="note" rows="2" placeholder="Why you saved it"></textarea>
      <label for="tripName">List</label>
      <input id="tripName" value="Someday" />
      <div class="row" style="margin-top:12px"><button class="primary" type="submit">Save</button></div>
    </form>
  </div>
  <div id="mapScreen" class="hidden">
    <div id="map"></div>
    <div class="mapbar">
      <button id="closeMap" type="button">Back to list</button>
      <button id="routeBtn" type="button">Route</button>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const KEY = "mapmyapps.v1";
    const home = [35.7826, -80.8873];
    const state = load();
    let map, layer, picked = null;
    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || { places: [], trips: ["Someday"] }; }
      catch { return { places: [], trips: ["Someday"] }; }
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function uid() { return Math.random().toString(36).slice(2, 9); }
    function trips() {
      state.trips = [...new Set(["Someday", ...state.trips, ...state.places.map(p => p.trip || "Someday")])];
      return state.trips;
    }
    function visible() {
      const trip = document.getElementById("tripFilter").value;
      return state.places.filter(p => trip === "All" || (p.trip || "Someday") === trip);
    }
    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = String(s == null ? "" : s);
      return d.innerHTML;
    }
    function navUrl(p) {
      return "https://maps.apple.com/directions?destination=" + p.lat + "," + p.lng + "&mode=driving";
    }
    function renderTrips() {
      const sel = document.getElementById("tripFilter");
      const current = sel.value || "All";
      sel.innerHTML = "<option>All</option>" + trips().map(t => "<option>" + t + "</option>").join("");
      sel.value = [...sel.options].some(o => o.value === current) ? current : "All";
    }
    function render() {
      renderTrips();
      const items = visible();
      document.getElementById("count").textContent = items.length ? items.length + " saved" : "Nothing saved yet";
      document.getElementById("list").innerHTML = items.map(p =>
        "<article class=\"place\"><h2>" + escapeHtml(p.name) + "</h2><div class=\"muted\">" + escapeHtml(p.address || "") + "</div>" +
        (p.note ? "<div class=\"muted\">" + escapeHtml(p.note) + "</div>" : "") +
        "<div class=\"muted\">" + escapeHtml(p.trip || "Someday") + "</div><div class=\"meta\">" +
        (p.source ? "<a class=\"btn\" href=\"" + p.source + "\" target=\"_blank\" rel=\"noopener\">Post</a>" : "") +
        "<a class=\"btn\" href=\"" + navUrl(p) + "\">Go</a><button data-del=\"" + p.id + "\">Remove</button></div></article>"
      ).join("") || "<p class=\"muted\">Copy a post link, then tap Paste. The list is the app. Map is only for looking.</p>";
    }
    async function searchPlaces(q) {
      const res = await fetch("https://photon.komoot.io/api/?q=" + encodeURIComponent(q) + "&limit=5");
      const data = await res.json();
      return (data.features || []).map(f => ({
        name: f.properties.name || q,
        address: [f.properties.street, f.properties.city, f.properties.state, f.properties.country].filter(Boolean).join(", "),
        lat: f.geometry.coordinates[1],
        lng: f.geometry.coordinates[0]
      }));
    }
    function openModal(prefill) {
      picked = null;
      document.getElementById("modal").classList.remove("hidden");
      document.getElementById("query").value = prefill.name || "";
      document.getElementById("note").value = "";
      document.getElementById("tripName").value = document.getElementById("tripFilter").value === "All" ? "Someday" : document.getElementById("tripFilter").value;
      document.getElementById("sourceLine").textContent = prefill.source || "Search the place, then save it to a list.";
      document.getElementById("form").dataset.source = prefill.source || "";
      document.getElementById("results").innerHTML = "";
    }
    function ensureMap() {
      if (map) return;
      map = L.map("map", { zoomControl: false }).setView(home, 11);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "OpenStreetMap", maxZoom: 19 }).addTo(map);
      layer = L.layerGroup().addTo(map);
    }
    function showMap() {
      const items = visible();
      document.getElementById("mapScreen").classList.remove("hidden");
      ensureMap();
      setTimeout(() => map.invalidateSize(), 50);
      layer.clearLayers();
      items.forEach(p => L.circleMarker([p.lat, p.lng], { radius: 8, color: "#e2a54a", fillColor: "#e2a54a", fillOpacity: 0.95 }).bindPopup(escapeHtml(p.name)).addTo(layer));
      if (items.length) map.fitBounds(L.latLngBounds(items.map(p => [p.lat, p.lng])).pad(0.3));
    }
    document.getElementById("query").addEventListener("input", () => {
      clearTimeout(window.__t);
      window.__t = setTimeout(async () => {
        const q = document.getElementById("query").value.trim();
        const box = document.getElementById("results");
        if (q.length < 2) { box.innerHTML = ""; return; }
        box.innerHTML = "<p class=\"muted\">Searching</p>";
        try {
          const hits = await searchPlaces(q);
          box._hits = hits;
          box.innerHTML = hits.map((h, i) => "<button type=\"button\" data-hit=\"" + i + "\">" + escapeHtml(h.name) + "<div class=\"muted\">" + escapeHtml(h.address) + "</div></button>").join("") || "<p class=\"muted\">No match. Add the city.</p>";
        } catch { box.innerHTML = "<p class=\"muted\">Search failed.</p>"; }
      }, 250);
    });
    document.getElementById("results").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-hit]");
      if (!btn) return;
      picked = document.getElementById("results")._hits[Number(btn.dataset.hit)];
      document.getElementById("query").value = picked.name;
      document.getElementById("results").innerHTML = "<p class=\"muted\">Ready: " + escapeHtml(picked.address) + "</p>";
    });
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!picked) { alert("Pick a search result."); return; }
      const trip = document.getElementById("tripName").value.trim() || "Someday";
      state.places.unshift({ id: uid(), name: picked.name, address: picked.address, lat: picked.lat, lng: picked.lng, note: document.getElementById("note").value.trim(), trip, source: document.getElementById("form").dataset.source || "", created: Date.now() });
      if (!state.trips.includes(trip)) state.trips.push(trip);
      save();
      document.getElementById("modal").classList.add("hidden");
      render();
    });
    document.getElementById("closeModal").onclick = () => document.getElementById("modal").classList.add("hidden");
    document.getElementById("addBtn").onclick = () => openModal({});
    document.getElementById("pasteBtn").onclick = async () => {
      let raw = "";
      try { raw = await navigator.clipboard.readText(); } catch (e) { raw = ""; }
      if (!raw) { alert("Copy the post link first, then tap Paste."); return; }
      const urlMatch = raw.match(/https?:\/\/\S+/);
      const source = urlMatch ? urlMatch[0] : raw;
      const name = raw.replace(source, "").replace(/https?:\/\/\S+/g, "").trim();
      openModal({ source, name });
    };
    document.getElementById("tripFilter").onchange = render;
    document.getElementById("list").onclick = (e) => {
      const del = e.target.closest("[data-del]");
      if (!del) return;
      state.places = state.places.filter(p => p.id !== del.dataset.del);
      save();
      render();
    };
    document.getElementById("mapBtn").onclick = showMap;
    document.getElementById("closeMap").onclick = () => document.getElementById("mapScreen").classList.add("hidden");
    document.getElementById("routeBtn").onclick = () => {
      const items = visible();
      if (!items.length) { alert("Add a place first."); return; }
      const last = items[items.length - 1];
      const stops = items.slice(0, -1).map(p => p.lat + "," + p.lng).join("+to:");
      location.href = "https://maps.apple.com/?saddr=Current+Location&daddr=" + (stops ? stops + "+to:" : "") + last.lat + "," + last.lng + "&dirflg=d";
    };
    render();
  </script>
</body>
</html>
