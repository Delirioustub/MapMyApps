<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#12140f" />
  <title>MapMyApps</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg:#12140f; --panel:#1c1f18; --line:#31362b; --text:#f3f1e7; --muted:#a7ab9c; --accent:#e2a54a; --ink:#1a1408; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { position:sticky; top:0; z-index:5; background:rgba(18,20,15,.96); padding:calc(12px + env(safe-area-inset-top)) 14px 12px; border-bottom:1px solid var(--line); }
    .row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    h1 { font-size:22px; margin:0; }
    h1 span { color:var(--accent); }
    .muted { color:var(--muted); font-size:13px; }
    button, a.btn, select { font:inherit; color:var(--text); background:#262a20; border:1px solid var(--line); border-radius:12px; padding:10px 12px; text-decoration:none; }
    .primary { background:var(--accent); color:var(--ink); border-color:transparent; font-weight:700; }
    main { padding:14px 14px calc(28px + env(safe-area-inset-bottom)); }
    textarea { width:100%; min-height:88px; font:inherit; color:var(--text); background:#1c1f18; border:1px solid var(--line); border-radius:14px; padding:12px; }
    .tools { display:flex; gap:8px; margin-top:8px; }
    select { flex:1; }
    .hit, .place { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:10px; }
    .hit { width:100%; text-align:left; }
    h2 { font-size:17px; margin:0 0 4px; }
    .meta { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    #mapScreen { position:fixed; inset:0; z-index:20; background:#cfcaba; }
    #map { position:absolute; inset:0; }
    .mapbar { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:12px; z-index:500; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <div>
        <h1>Map<span>My</span>Apps</h1>
        <div class="muted" id="count">Your places</div>
      </div>
      <button id="mapBtn" type="button">Map</button>
    </div>
  </header>
  <main>
    <p class="muted">Copy the caption, not just the link. Paste it here. Tap the place.</p>
    <textarea id="blob" placeholder="Paste the caption. Include the place name."></textarea>
    <div class="tools">
      <select id="tripFilter" aria-label="List"></select>
      <button id="findBtn" class="primary" type="button">Find place</button>
    </div>
    <div id="hits"></div>
    <div id="list"></div>
  </main>
  <div id="mapScreen" class="hidden">
    <div id="map"></div>
    <div class="mapbar"><button id="closeMap" type="button">Back to list</button></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const KEY = "mapmyapps.v1";
    const home = [35.7826, -80.8873];
    const state = load();
    let map, layer;
    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || { places: [], trips: ["Someday"] }; }
      catch { return { places: [], trips: ["Someday"] }; }
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function uid() { return Math.random().toString(36).slice(2, 9); }
    function trips() {
      state.trips = [...new Set(["Someday", ...state.trips, ...state.places.map(p => p.trip || "Someday")])];
      return state.trips;
    }
    function visible() {
      const trip = document.getElementById("tripFilter").value;
      return state.places.filter(p => trip === "All" || (p.trip || "Someday") === trip);
    }
    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = String(s == null ? "" : s);
      return d.innerHTML;
    }
    function navUrl(p) {
      return "https://maps.apple.com/directions?destination=" + p.lat + "," + p.lng + "&mode=driving";
    }
    function renderTrips() {
      const sel = document.getElementById("tripFilter");
      const current = sel.value || "Someday";
      sel.innerHTML = trips().map(t => "<option>" + t + "</option>").join("");
      sel.value = [...sel.options].some(o => o.value === current) ? current : "Someday";
    }
    function render() {
      renderTrips();
      const items = visible();
      document.getElementById("count").textContent = items.length ? items.length + " saved" : "Nothing saved yet";
      document.getElementById("list").innerHTML = items.map(p =>
        "<article class=\"place\"><h2>" + escapeHtml(p.name) + "</h2><div class=\"muted\">" + escapeHtml(p.address || "") + "</div><div class=\"meta\">" +
        (p.source ? "<a class=\"btn\" href=\"" + p.source + "\">Post</a>" : "") +
        "<a class=\"btn\" href=\"" + navUrl(p) + "\">Go</a><button data-del=\"" + p.id + "\" type=\"button\">Remove</button></div></article>"
      ).join("");
    }
    function junk(s) {
      return /instagram|facebook|pinterest|reel|pin on|watch on/i.test(s) && s.length < 40;
    }
    function queries(text) {
      const url = (text.match(/https?:\/\/\S+/) || [""])[0];
      const words = text.replace(/https?:\/\/\S+/g, " ").replace(/[@#][\w.]+/g, " ");
      const bits = words.split(/[\n.!?|]/).map(s => s.replace(/\s+/g, " ").trim()).filter(s => s.length > 2 && s.length < 80 && !junk(s));
      const ranked = bits.sort((a, b) => b.length - a.length).slice(0, 3);
      if (!ranked.length && words.trim() && !junk(words)) ranked.push(words.trim().slice(0, 80));
      return { url, ranked };
    }
    async function searchPlaces(q) {
      const res = await fetch("https://photon.komoot.io/api/?q=" + encodeURIComponent(q) + "&limit=3");
      const data = await res.json();
      return (data.features || []).map(f => ({
        name: f.properties.name || q,
        address: [f.properties.street, f.properties.city, f.properties.state, f.properties.country].filter(Boolean).join(", "),
        lat: f.geometry.coordinates[1],
        lng: f.geometry.coordinates[0]
      }));
    }
    async function find() {
      const box = document.getElementById("hits");
      const raw = document.getElementById("blob").value.trim();
      if (!raw) { box.innerHTML = "<p class=\"muted\">Paste the caption first.</p>"; return; }
      box.innerHTML = "<p class=\"muted\">Looking</p>";
      const parsed = queries(raw);
      let found = [];
      for (const q of parsed.ranked) {
        try { found = found.concat(await searchPlaces(q)); } catch (e) {}
      }
      const seen = new Set();
      found = found.filter(h => { const k = h.name + h.address; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 5);
      if (!found.length) { box.innerHTML = "<p class=\"muted\">No place in that text. Paste the line that names it.</p>"; return; }
      box._hits = found;
      box._source = parsed.url;
      box.innerHTML = found.map((h, i) => "<button class=\"hit\" type=\"button\" data-hit=\"" + i + "\"><h2>" + escapeHtml(h.name) + "</h2><div class=\"muted\">" + escapeHtml(h.address) + "</div><div class=\"muted\">Tap to save</div></button>").join("");
    }
    document.getElementById("findBtn").onclick = find;
    document.getElementById("hits").onclick = (e) => {
      const btn = e.target.closest("[data-hit]");
      if (!btn) return;
      const hit = document.getElementById("hits")._hits[Number(btn.dataset.hit)];
      const trip = document.getElementById("tripFilter").value || "Someday";
      state.places.unshift({ id: uid(), name: hit.name, address: hit.address, lat: hit.lat, lng: hit.lng, note: "", trip, source: document.getElementById("hits")._source || "", created: Date.now() });
      save();
      document.getElementById("blob").value = "";
      document.getElementById("hits").innerHTML = "<p class=\"muted\">Saved " + escapeHtml(hit.name) + "</p>";
      render();
    };
    document.getElementById("list").onclick = (e) => {
      const del = e.target.closest("[data-del]");
      if (!del) return;
      state.places = state.places.filter(p => p.id !== del.dataset.del);
      save();
      render();
    };
    function ensureMap() {
      if (map) return;
      map = L.map("map", { zoomControl: false }).setView(home, 11);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "OpenStreetMap", maxZoom: 19 }).addTo(map);
      layer = L.layerGroup().addTo(map);
    }
    document.getElementById("mapBtn").onclick = () => {
      const items = visible();
      document.getElementById("mapScreen").classList.remove("hidden");
      ensureMap();
      setTimeout(() => map.invalidateSize(), 50);
      layer.clearLayers();
      items.forEach(p => L.circleMarker([p.lat, p.lng], { radius: 8, color: "#e2a54a", fillColor: "#e2a54a", fillOpacity: 0.95 }).bindPopup(escapeHtml(p.name)).addTo(layer));
      if (items.length) map.fitBounds(L.latLngBounds(items.map(p => [p.lat, p.lng])).pad(0.3));
    };
    document.getElementById("closeMap").onclick = () => document.getElementById("mapScreen").classList.add("hidden");
    document.getElementById("tripFilter").onchange = render;
    render();
  </script>
</body>
</html>
