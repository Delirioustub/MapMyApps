<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#12140f" />
  <title>MapMyApps</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg:#12140f; --panel:#1c1f18; --line:#31362b; --text:#f3f1e7; --muted:#a7ab9c; --accent:#e2a54a; --ink:#1a1408; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { position:sticky; top:0; z-index:5; background:rgba(18,20,15,.96); padding:calc(12px + env(safe-area-inset-top)) 14px 12px; border-bottom:1px solid var(--line); }
    .row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    h1 { font-size:22px; margin:0; }
    h1 span { color:var(--accent); }
    .muted { color:var(--muted); font-size:13px; }
    button, a.btn, select { font:inherit; color:var(--text); background:#262a20; border:1px solid var(--line); border-radius:12px; padding:10px 12px; text-decoration:none; }
    .primary { background:var(--accent); color:var(--ink); border-color:transparent; font-weight:700; }
    main { padding:14px 14px calc(28px + env(safe-area-inset-bottom)); }
    textarea { width:100%; min-height:88px; font:inherit; color:var(--text); background:#1c1f18; border:1px solid var(--line); border-radius:14px; padding:12px; }
    .tools { display:flex; gap:8px; margin-top:8px; }
    select { flex:1; }
    .hit, .place { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:10px; }
    .hit { width:100%; text-align:left; }
    h2 { font-size:17px; margin:0 0 4px; }
    .meta { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    #mapScreen { position:fixed; inset:0; z-index:20; background:#cfcaba; }
    #map { position:absolute; inset:0; }
    .mapbar { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:12px; z-index:500; background:rgba(18,20,15,.85); padding:8px; border-radius:14px; backdrop-filter:blur(8px); }
    .hidden { display:none !important; }
      .mapbar { display:flex; gap:8px; flex-wrap:wrap; right:12px; }
    .stop { background:#e2a54a; color:#111; border-radius:50%; width:26px; height:26px; line-height:26px; text-align:center; font-weight:700; border:2px solid #111; }
      .ask { background:#2d3224; border:2px solid #e2a54a; border-radius:14px; padding:12px; display:grid; gap:10px; }
    .ask p { margin:0; font-size:1.05em; }
    .ask input { font:inherit; font-size:18px; padding:12px; border-radius:10px; border:1px solid var(--line); background:#1b1e17; color:var(--text); }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <div>
        <h1>Map<span>My</span>Apps</h1>
        <div class="muted" id="count">Your places</div>
      </div>
      <button id="mapBtn" type="button">Map</button>
    </div>
  </header>
  <main>
    <p class="muted">Share a post to MapMyApps, or paste the caption here. Tap the place to save it.</p>
    <textarea id="blob" placeholder="Paste the caption. Include the place name."></textarea>
    <div class="tools">
      <select id="tripFilter" aria-label="List"></select>
      <button id="routeBtn" type="button" class="hidden">Route</button>
      <button id="findBtn" class="primary" type="button">Find place</button>
    </div>
    <div id="hits"></div>
    <div id="list"></div>
  </main>
  <div id="mapScreen" class="hidden">
    <div id="map"></div>
    <div class="mapbar"><button id="closeMap" type="button">Back to list</button><a id="appleRoute" class="btn hidden" href="#">Apple Maps</a><a id="googleRoute" class="btn hidden" href="#">Google Maps</a></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const KEY = "mapmyapps.v1";
    const home = [35.7826, -80.8873];
    const state = load();
    let map, layer;
    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || { places: [], trips: ["Someday"] }; }
      catch { return { places: [], trips: ["Someday"] }; }
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function uid() { return Math.random().toString(36).slice(2, 9); }
    function trips() {
      state.trips = [...new Set(["Someday", ...state.trips, ...state.places.map(p => p.trip || "Someday")])];
      return state.trips;
    }
    function visible() {
      const trip = document.getElementById("tripFilter").value;
      return state.places.filter(p => trip === "All" || (p.trip || "Someday") === trip);
    }
    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = String(s == null ? "" : s);
      return d.innerHTML;
    }
    function navUrl(p) {
      return "https://maps.apple.com/directions?destination=" + p.lat + "," + p.lng + "&mode=driving";
    }
    function renderTrips() {
      const sel = document.getElementById("tripFilter");
      const current = sel.value || "Someday";
      sel.innerHTML = trips().map(t => "<option>" + t + "</option>").join("");
      sel.value = [...sel.options].some(o => o.value === current) ? current : "Someday";
    }
    function render() {
      renderTrips();
      const items = visible();
      document.getElementById("routeBtn").classList.toggle("hidden", items.length < 2);
      document.getElementById("count").textContent = items.length ? items.length + " saved" : "Nothing saved yet";
      document.getElementById("list").innerHTML = items.map(p =>
        "<article class=\"place\"><h2>" + escapeHtml(p.name) + "</h2><div class=\"muted\">" + escapeHtml(p.address || "") + "</div><div class=\"meta\">" +
        (p.source ? "<a class=\"btn\" href=\"" + p.source + "\">Post</a>" : "") +
        "<a class=\"btn\" href=\"" + navUrl(p) + "\">Go</a><button data-del=\"" + p.id + "\" type=\"button\">Remove</button></div></article>"
      ).join("");
    }
    function junk(s) {
      return /^(instagram|facebook|pinterest|tiktok|reels?|pin on|watch on|link in bio|follow|save this|tag a friend|repost)\b/i.test(s) || s.length < 3;
    }
    function tidy(s) {
      return s.replace(/https?:\/\/\S+/g, " ").replace(/\p{Extended_Pictographic}|[\u{1F1E6}-\u{1F1FF}\u{FE0F}\u{200D}]/gu, " ")
        .replace(/[#@][\w.]+/g, " ").replace(/[“”"*_~|•·]+/g, " ").replace(/\s+/g, " ").replace(/^[\s,.:;!-]+|[\s,.:;!-]+$/g, "").trim();
    }
    function splitTag(t) {
      return t.replace(/[._]+/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/\b(nyc|atl|la)\b/gi, m => m.toUpperCase()).trim();
    }
    function queries(text) {
      const url = (text.match(/https?:\/\/\S+/) || [""])[0];
      const out = [];
      const add = q => { q = tidy(q); if (q.length > 2 && q.length < 90 && !junk(q) && !out.some(o => o.toLowerCase() === q.toLowerCase())) out.push(q); };
      for (const m of text.matchAll(/(?:📍|📌|🗺️?|location:|address:)\s*([^\n#!?]+)/giu)) add(m[1]);
      const flat = text.replace(/https?:\/\/\S+/g, " ").replace(/\s+/g, " ");
      for (const m of flat.matchAll(/\b(?:at|@|visited|from|inside)\s+((?:the\s)?[A-Z][\w'’&.-]*(?:\s+(?:[A-Z0-9][\w'’&.-]*|of|de|la|the|and|&)){0,5})(?:\s*(?:in|,)\s*([A-Z][\w'’.-]*(?:\s+[A-Z][\w'’.-]*){0,2}))?/g)) add(m[2] ? m[1] + " " + m[2] : m[1]);
      for (const m of flat.matchAll(/\b([A-Z][\w'’&.-]*(?:\s+[A-Z0-9][\w'’&.-]*){0,4})\s*(?:in|,)\s*([A-Z][\w'’.-]*(?:\s+[A-Z][\w'’.-]*){0,2})/g)) add(m[1] + " " + m[2]);
      text.split(/\n+/).forEach(line => { const t = tidy(line); if (t.length < 60) add(t); else t.split(/[.!?]+/).forEach(add); });
      const tags = [...text.matchAll(/#([A-Z][a-z]{3,}(?:[A-Z][a-z]+)?)\b/g)].map(m => splitTag(m[1]));
      if (tags.length) out.slice(0, 2).filter(q => q.length < 40).reverse().forEach(q => { const c = q + " " + tags[0]; if (!out.includes(c)) out.unshift(c); });
      for (const m of text.matchAll(/@([\w.]{3,})/g)) if (!/\d{3}/.test(m[1])) add(splitTag(m[1]));
      for (const m of text.matchAll(/#(\w{4,})/g)) if (/[A-Z].*[A-Z]|_/.test(m[1])) add(splitTag(m[1]));
      return { url, ranked: out.slice(0, 6) };
    }
    function withTimeout(url, ms) {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), ms);
      return fetch(url, { signal: c.signal }).finally(() => clearTimeout(t));
    }
    async function photon(q) {
      const res = await withTimeout("https://photon.komoot.io/api/?q=" + encodeURIComponent(q) + "&limit=4", 12000);
      if (!res.ok) throw new Error("photon " + res.status);
      const data = await res.json();
      return (data.features || []).map(f => ({
        name: f.properties.name || q,
        address: [f.properties.street, f.properties.city, f.properties.state, f.properties.country].filter(Boolean).join(", "),
        lat: f.geometry.coordinates[1],
        lng: f.geometry.coordinates[0]
      }));
    }
    async function nominatim(q) {
      const res = await withTimeout("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=3&q=" + encodeURIComponent(q), 9000);
      if (!res.ok) throw new Error("nominatim " + res.status);
      return (await res.json()).map(r => ({ name: r.name || r.display_name.split(",")[0], address: r.display_name.split(",").slice(1, 4).join(",").trim(), lat: +r.lat, lng: +r.lon }));
    }
    async function searchPlaces(qs) {
      let failures = 0, nomOk = false;
      const lists = await Promise.all(qs.map(q => photon(q).catch(() => { failures++; return []; })));
      let found = lists.flat();
      if (!found.length) {
        for (const q of qs.slice(0, 2)) {
          try { found = found.concat(await nominatim(q)); nomOk = true; } catch (e) {}
          if (found.length) break;
          await new Promise(r => setTimeout(r, 1100));
        }
      }
      return { found, offline: !found.length && failures >= qs.length && !nomOk };
    }
    const CITY_ABBR = { la: "Los Angeles", dtla: "Los Angeles", nyc: "New York", ny: "New York", sf: "San Francisco", atl: "Atlanta", chi: "Chicago", chitown: "Chicago", dc: "Washington DC", nola: "New Orleans", phx: "Phoenix", oc: "Orange County", sd: "San Diego", lv: "Las Vegas", vegas: "Las Vegas", philly: "Philadelphia", avl: "Asheville", clt: "Charlotte", atx: "Austin", htx: "Houston", pdx: "Portland", sea: "Seattle", bos: "Boston", mia: "Miami", nash: "Nashville", chs: "Charleston", sav: "Savannah", ldn: "London", hk: "Hong Kong", bkk: "Bangkok", cdmx: "Mexico City" };
    const CITY_TAGS = { losangeles: "Los Angeles", newyork: "New York", newyorkcity: "New York", sanfrancisco: "San Francisco", chicago: "Chicago", atlanta: "Atlanta", miami: "Miami", seattle: "Seattle", boston: "Boston", austin: "Austin", houston: "Houston", dallas: "Dallas", nashville: "Nashville", charleston: "Charleston", charlotte: "Charlotte", asheville: "Asheville", savannah: "Savannah", neworleans: "New Orleans", sandiego: "San Diego", lasvegas: "Las Vegas", portland: "Portland", denver: "Denver", phoenix: "Phoenix", paris: "Paris", london: "London", rome: "Rome", tokyo: "Tokyo", barcelona: "Barcelona", lisbon: "Lisbon", hongkong: "Hong Kong", toronto: "Toronto" };
    const sq = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
    const STREET = "(?:St|Street|Ave|Avenue|Blvd|Boulevard|Rd|Road|Dr|Drive|Way|Ln|Lane|Pl|Place|Ct|Court|Hwy|Highway|Pkwy|Parkway|Sq|Square|Ter|Terrace|Cir)";
    function findCities(text) {
      const out = [];
      const add = (c, w) => { c = c.trim(); if (c && !out.some(o => sq(o.name) === sq(c))) out.push({ name: c, w }); };
      for (const m of text.matchAll(/\b([A-Z][a-zA-Z.'-]+(?: [A-Z][a-zA-Z.'-]+){0,2}),\s*([A-Z]{2})\b(?:\s*\d{5})?/g)) if (!/\d/.test(m[1])) add(m[1] + ", " + m[2], 5);
      for (const m of text.matchAll(/\b\d{5}\s+([A-Z][a-zA-ZÀ-ÿ'-]+(?: [A-Z][a-zA-ZÀ-ÿ'-]+)?)/g)) add(m[1], 5);
      for (const m of text.matchAll(/\b(?:[Ii]n|IN|[Tt]o|TO|à|en)\s+((?:[A-Z][a-zA-ZÀ-ÿ'.-]+)(?: [A-Z][a-zA-ZÀ-ÿ'.-]+){0,2})/g)) {
        const c = m[1]; if (/^[A-Z]{2,5}$/.test(c) && CITY_ABBR[c.toLowerCase()]) add(CITY_ABBR[c.toLowerCase()], 4); else if (/^[A-Z][a-zà-ÿ]/.test(c)) add(c, 4);
      }
      for (const m of text.matchAll(/\b([A-Z]{2,5})\b/g)) if (CITY_ABBR[m[1].toLowerCase()] && m[1] !== "SEA" && m[1] !== "NASH") add(CITY_ABBR[m[1].toLowerCase()], 3);
      for (const m of text.matchAll(/#(\w+)/g)) {
        const t = m[1].toLowerCase();
        for (const [k, v] of Object.entries({ ...CITY_TAGS, ...CITY_ABBR })) if (t === k || (t.startsWith(k) && /^(eats?|food|foodie|foodies|restaurants?|travel|life|living|brunch|coffee|bars?|eats|dining|things|tok)$/.test(t.slice(k.length)))) add(v, 2);
      }
      return out.sort((a, b) => b.w - a.w);
    }
    function findAddresses(text) {
      const out = [];
      const lines = text.split(/\n/);
      lines.forEach((line, i) => {
        const l = line.replace(/\p{Extended_Pictographic}|\u{FE0F}/gu, " ");
        let m = l.match(new RegExp("\\b(\\d{1,6}[A-Za-z]?\\s+(?:[NSEW]\\.?\\s+)?(?:[A-Z0-9][\\w.'-]*\\s+){0,4}" + STREET + "\\b\\.?(?:[^\\n]*)?)"));
        if (!m) m = l.match(/\b(\d{1,4}(?:\s?bis)?,?\s+(?:rue|avenue|av\.|boulevard|bd|place|quai|calle|via|carrer|rua)\s+[^\n,]+(?:,?\s*\d{4,5}\s+[A-ZÀ-ÿ][^\n,]*)?)/i);
        if (!m) return;
        let addr = m[1].replace(/,?\s*(?:Floor|Fl|Suite|Ste|Unit|#)\s*[\w-]+/gi, "").replace(/@[\w.]+|#\w+/g, "").trim();
        const next = (lines[i + 1] || "").trim();
        if (!/,\s*[A-Z][a-z]/.test(addr) && /^[A-Z][\w .'-]+,\s*[A-Z]{2}\b/.test(next)) addr += ", " + next;
        let label = "";
        const before = l.slice(0, m.index).replace(/[📍📌:•,\s]+$/u, "").replace(/^[\s📍📌:•]+/u, "").trim();
        if (before && before.length < 50) label = before;
        else for (let j = i - 1; j >= Math.max(0, i - 2); j--) { const pm = lines[j].match(/(?:📍|📌)\s*:?\s*([^\n@#]+)/u); if (pm) { label = pm[1].trim(); break; } }
        out.push({ q: addr.replace(/\s+/g, " "), label: tidy(label) });
      });
      return out;
    }
    function handleName(h, text) {
      let core = h.toLowerCase().replace(/[._]+/g, " ").trim();
      const strip = w => w.replace(/^(eat|eats|the|visit|its|official)\s*/, "").replace(/\s*(la|nyc|sf|usa|us|official|restaurant|hq|eats|cafe|\d+)$/, "").trim();
      const words = core.split(" ");
      const cityish = new Set(Object.keys(CITY_ABBR).concat(Object.keys(CITY_TAGS)));
      while (words.length > 1 && (cityish.has(words[words.length - 1]) || /^(usa|us|official|\d+)$/.test(words[words.length - 1]) || text.toLowerCase().includes(words[words.length - 1] + ",") )) words.pop();
      core = words.join(" ");
      const targets = [sq(core), sq(strip(core)), sq(strip(strip(core)))].filter(t => t.length >= 4);
      const toks = text.replace(/[@#][\w.]+/g, " ").match(/[\p{L}\p{N}'’&]+/gu) || [];
      for (let n = 4; n >= 1; n--) for (let i = 0; i + n <= toks.length; i++) {
        const phrase = toks.slice(i, i + n).join(" ");
        if (targets.includes(sq(phrase)) && /\p{Lu}/u.test(phrase[0])) return phrase;
      }
      return words.length > 1 ? core.replace(/\b\w/g, c => c.toUpperCase()) : (strip(core) || core);
    }
    function findNames(text) {
      const out = [];
      const add = (q, w, area) => { q = tidy(q).replace(/^[:\-\s]+/, ""); if (q.length > 2 && q.length < 60 && !junk(q) && !out.some(o => sq(o.q) === sq(q))) out.push({ q, w, area: area || "" }); };
      const pins = [...text.matchAll(/(?:📍|📌)\s*:?\s*([^\n]+)/gu)].map(m => m[1]);
      pins.forEach(p => {
        const hm = p.match(/@([\w.]{3,})/);
        let body = p.replace(/@[\w.]+|#\w+/g, " ").replace(/\p{Extended_Pictographic}|\u{FE0F}/gu, " ").trim();
        if (new RegExp("\\d+\\s+\\S+.*" + STREET + "\\b|\\d{5}").test(body)) body = body.split(",")[0];
        const parts = body.split(/,|\s[-–—]\s/).map(s => s.trim()).filter(Boolean);
        if (parts[0] && parts[0].length > 2) add(parts[0].replace(/\s+[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}]+$/u, ""), 3, parts.slice(1).join(" ").replace(/\(.*?\)/g, "").trim());
        else if (hm) add(handleName(hm[1], text), 3);
      });
      const pinCount = out.length;
      for (const m of text.matchAll(/(^|[^\w])@([\w.]{3,})/g)) {
        const before = text.slice(Math.max(0, m.index - 14), m.index + m[1].length).toLowerCase();
        if (/(follow|chef|by|photo|📸|credit|thanks|with|et)\s*$/.test(before)) continue;
        add(handleName(m[2], text), 2.5);
      }
      for (const m of text.matchAll(/\b(?:at|chez|visited|inside|to)\s+((?:[A-Z][\w'’&.-]*)(?:\s+(?:[A-Z0-9][\w'’&.-]*|of|de|la|the|and|&)){0,4})/g)) if (!CITY_ABBR[m[1].toLowerCase()]) add(m[1], 2);
      for (const m of text.matchAll(/^\s*([A-Z][\w'’&.-]*(?:\s+[A-Z0-9][\w'’&.-]*){0,4})\s*!/gm)) add(m[1], 2);
      queries(text).ranked.forEach(q => add(q, 1));
      return { names: out, pinCount };
    }
    function km(a, b) {
      const R = 6371, d1 = (b.lat - a.lat) * Math.PI / 180, d2 = (b.lng - a.lng) * Math.PI / 180;
      const x = Math.sin(d1 / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(d2 / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(x));
    }
    async function photonAt(q, center, extra) {
      const res = await withTimeout("https://photon.komoot.io/api/?q=" + encodeURIComponent(q) + "&limit=" + (extra ? 1 : 5) + (center ? "&lat=" + center.lat + "&lon=" + center.lng : "") + (extra || ""), 12000);
      if (!res.ok) throw new Error("photon " + res.status);
      const data = await res.json();
      return (data.features || []).map(f => ({
        name: f.properties.name || [f.properties.housenumber, f.properties.street].filter(Boolean).join(" ") || q,
        address: [[f.properties.housenumber, f.properties.street].filter(Boolean).join(" "), f.properties.city || f.properties.district, f.properties.state, f.properties.country].filter(Boolean).join(", "),
        lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0], kind: f.properties.osm_key
      }));
    }
    async function cityCenter(cities) {
      const geo = async (c, near) => { try { const r = await photonAt(c.name.replace(/[.!]+$/, ""), near, "&osm_tag=place"); return r[0] && nameMatch(r[0].name, c.name.replace(/,\s*[A-Z]{2}$/, "")) >= 0.7 ? { ...r[0], label: c.name } : null; } catch (e) { return null; } };
      const list = cities.slice(0, 3);
      const firsts = await Promise.all(list.map(c => geo(c)));
      const i = firsts.findIndex(Boolean);
      if (i < 0) return null;
      const bi = list.findIndex((c, k) => k > i && firsts[k] && c.w < list[i].w);
      const broad = bi > 0 ? firsts[bi] : null;
      if (list[i].w === 4 && broad && km(firsts[i], broad) > 150) {
        const again = await geo(list[i], broad);
        return again && km(again, broad) < 80 ? again : broad;
      }
      return firsts[i];
    }
    function nameMatch(hitName, q) {
      const a = sq(hitName), b = sq(q);
      if (!a || !b) return 0;
      if (a === b) return 1;
      if (a.includes(b) || b.includes(a)) return 0.8;
      const wa = new Set(String(hitName).toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 2));
      const wb = String(q).toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 2);
      return wb.length ? wb.filter(w => wa.has(w)).length / Math.max(wb.length, wa.size) * 0.7 : 0;
    }
    async function locate(text) {
      const cities = findCities(text);
      const addrs = findAddresses(text).slice(0, 2);
      const { names, pinCount } = findNames(text);
      if (!addrs.length && !names.length) return { found: [], offline: false, empty: true };
      const center = cities.length ? await cityCenter(cities) : null;
      const cityName = center ? center.label.replace(/,\s*[A-Z]{2}$/, "") : "";
      let calls = 0, fails = 0;
      const multi = pinCount >= 3;
      const jobs = [];
      const pick = multi ? names.filter(n => n.w === 3).slice(0, 8) : names.slice(0, 4);
      pick.forEach((n, i) => {
        const qs = multi ? [n.q + " " + (n.area || cityName)] : [n.q, cityName && !sq(n.q).includes(sq(cityName)) ? n.q + " " + cityName : ""];
        qs.filter(Boolean).forEach(q => jobs.push(photonAt(q.trim(), center).then(r => r.map(h => ({ ...h, from: n, order: i }))).catch(() => { fails++; return []; }).finally(() => calls++)));
      });
      const lists = await Promise.all(jobs);
      let hits = [];
      for (const [i, a] of addrs.entries()) {
        if (i) await new Promise(r => setTimeout(r, 1100));
        const q = a.q + (cityName && !a.q.toLowerCase().includes(cityName.toLowerCase()) && !/,\s*[A-Z]{2}\b|\d{5}/.test(a.q) ? ", " + cityName : "");
        try {
          calls++;
          let r = await nominatim(q);
          if (!r.length) r = await nominatim(q.replace(/^(\d+)\s+[NSEW]\.?\s+/, "$1 "));
          r.slice(0, 1).forEach(h => hits.push({ name: a.label || a.q.split(",")[0], address: a.q, lat: h.lat, lng: h.lng, score: 6 + (center && km(center, h) < 40 ? 1 : 0), label: a.label }));
        } catch (e) { fails++; }
      }
      for (const list of lists) for (const h of list) {
        const n = h.from;
        let s = n.w + nameMatch(h.name, n.q) * 4 - h.order * 0.15;
        if (center) { const d = km(center, h); s += d < 25 ? 2 : d < 80 ? 1.2 : d < 300 ? 0 : -2.5; }
        if (h.kind === "place" || h.kind === "boundary" || h.kind === "highway") s -= 3;
        if (nameMatch(h.name, cityName) > 0.7) s -= 2;
        hits.push({ name: h.name, address: h.address, lat: h.lat, lng: h.lng, score: s, label: multi ? n.q : "" });
      }
      if (!multi) {
        const top = Math.max(-9, ...hits.map(h => h.score));
        if (top < 6) for (const n of pick.slice(0, 2)) {
          await new Promise(r => setTimeout(r, 1100));
          try {
            calls++;
            const r = await nominatim(n.q + (cityName ? ", " + cityName : ""));
            r.forEach(h => hits.push({ ...h, score: n.w + nameMatch(h.name, n.q) * 4 + (center && km(center, h) < 80 ? 1.5 : 0), label: "" }));
          } catch (e) { fails++; }
        }
      }
      // a labeled address pin and a named search hit for the same place: keep one
      hits.sort((a, b) => b.score - a.score);
      const seen = [];
      hits = hits.filter(h => { if (seen.some(o => km(o, h) < 0.05 && (sq(o.name) === sq(h.name) || nameMatch(o.name, h.name) > 0.6))) return false; seen.push(h); return true; });
      if (multi) {
        const best = [];
        pick.forEach(n => { const h = hits.find(x => x.label === n.q && x.score > 5); if (h) best.push(h); });
        hits.filter(h => !h.label || !pick.some(n => n.q === h.label)).slice(0, 2).forEach(h => best.push(h));
        return { found: best.slice(0, 10), offline: calls > 0 && fails >= calls, multi: true, city: cityName };
      }
      return { found: hits.slice(0, 6), offline: calls > 0 && fails >= calls, city: cityName };
    }
    async function postText(url) {
      if (!/tiktok\.com/i.test(url)) return "";
      try {
        const res = await withTimeout("https://www.tiktok.com/oembed?url=" + encodeURIComponent(url), 7000);
        const d = await res.json();
        return [d.title, d.author_name].filter(Boolean).join("\n");
      } catch (e) { return ""; }
    }
    function askName(box, link, msg) {
      box.innerHTML = "<div class=\"ask\"><p>" + msg + "</p><input id=\"placeName\" type=\"search\" enterkeyhint=\"search\" autocomplete=\"off\" placeholder=\"Place name and city, e.g. Joe's Pizza New York\"><button id=\"askGo\" class=\"primary\" type=\"button\">Find it</button></div>";
      const inp = document.getElementById("placeName");
      const go = () => { const v = inp.value.trim(); if (!v) return inp.focus(); document.getElementById("blob").value = v + (link ? "\n" + link : ""); find(); };
      document.getElementById("askGo").onclick = go;
      inp.onkeydown = e => { if (e.key === "Enter") go(); };
      inp.focus();
      box.scrollIntoView({ block: "start" });
    }
    function urlHint(u) {
      let x; try { x = new URL(u); } catch { return null; }
      const all = decodeURIComponent(x.href);
      const ll = all.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/) || all.match(/[?&](?:ll|sll|center|query|q|daddr|destination)=(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/);
      const qp = x.searchParams.get("q") || x.searchParams.get("query") || x.searchParams.get("address") || x.searchParams.get("name") || x.searchParams.get("daddr") || x.searchParams.get("destination");
      const place = (x.pathname.match(/\/place\/([^/@]+)/) || [])[1];
      let name = place ? place.replace(/\+/g, " ") : (qp && !/^-?\d/.test(qp) ? qp : "");
      if (ll) return { coords: { lat: +ll[1], lng: +ll[2] }, name: name || "Shared map spot" };
      if (name) return { text: name };
      if (/instagram|facebook|fb\.|pinterest|pin\.it|tiktok|threads|x\.com|twitter|goo\.gl|maps\.app/i.test(x.hostname)) return null;
      const slug = x.pathname.split("/").filter(seg => /[a-z]{3,}-[a-z]/i.test(seg)).pop();
      return slug ? { text: slug.replace(/\.\w+$/, "").replace(/[-_]+/g, " ").replace(/\b\d{4,}\b/g, "").trim() } : null;
    }
    async function find() {
      const box = document.getElementById("hits");
      const raw = document.getElementById("blob").value.trim();
      if (!raw) { askName(box, "", "Type the place name to find it."); return; }
      box.innerHTML = "<p class=\"muted\">Looking…</p>";
      const parsed = queries(raw);
      let found = [], searchText = raw, multi = false, offline = false;
      if (parsed.url && !parsed.ranked.length) {
        const h = urlHint(parsed.url);
        if (h && h.coords) found.push({ name: h.name, address: h.coords.lat.toFixed(5) + ", " + h.coords.lng.toFixed(5), lat: h.coords.lat, lng: h.coords.lng });
        else if (h && h.text) searchText = h.text;
        else searchText = await postText(parsed.url);
      }
      if (!found.length && searchText) {
        const r = await locate(searchText);
        found = r.found; offline = r.offline; multi = !!r.multi;
        if (r.empty) searchText = "";
      }
      if (!found.length && !searchText) {
        const site = (parsed.url.match(/instagram|facebook|fb\.|tiktok|pinterest|pin\.it|threads|x\.com|twitter/i) || [""])[0];
        askName(box, parsed.url, (site ? "That post's link doesn't say where it is" : "I couldn't find a place in that") + ". Type the place name (and city if you know it):");
        return;
      }
      if (!found.length) {
        askName(box, parsed.url, offline ? "Couldn't reach the map search. Check your internet connection and try again." : "I couldn't match a place from that. Type the place name (and city):");
        return;
      }
      box._hits = found;
      box._multi = multi;
      box._source = parsed.url;
      box.innerHTML = (multi ? "<p class=\"muted\">This post names several places. Tap each one you want to save.</p>" : "") + found.map((h, i) => "<button class=\"hit\" type=\"button\" data-hit=\"" + i + "\">" + (multi && h.label ? "<div class=\"muted\">📍 " + escapeHtml(h.label) + "</div>" : "") + "<h2>" + escapeHtml(h.name) + "</h2><div class=\"muted\">" + escapeHtml(h.address) + "</div><div class=\"muted\">Tap to save</div></button>").join("") +
        "<button id=\"notIt\" type=\"button\">None of these</button>";
      document.getElementById("notIt").onclick = () => askName(box, parsed.url, "Type the place name (and city):");
    }
    document.getElementById("findBtn").onclick = find;
    document.getElementById("hits").onclick = (e) => {
      const btn = e.target.closest("[data-hit]");
      if (!btn) return;
      const hit = document.getElementById("hits")._hits[Number(btn.dataset.hit)];
      const trip = document.getElementById("tripFilter").value || "Someday";
      state.places.unshift({ id: uid(), name: hit.name, address: hit.address, lat: hit.lat, lng: hit.lng, note: "", trip, source: document.getElementById("hits")._source || "", created: Date.now() });
      save();
      if (document.getElementById("hits")._multi) { btn.disabled = true; btn.querySelector(".muted:last-child").textContent = "Saved ✓"; render(); return; }
      document.getElementById("blob").value = "";
      document.getElementById("hits").innerHTML = "<p class=\"muted\">Saved " + escapeHtml(hit.name) + "</p>";
      render();
    };
    document.getElementById("list").onclick = (e) => {
      const del = e.target.closest("[data-del]");
      if (!del) return;
      state.places = state.places.filter(p => p.id !== del.dataset.del);
      save();
      render();
    };
    // Drop a Google Maps API key here for official Google tiles.
    // Leave empty to use the polished free Carto layer (recommended default).
    const GOOGLE_MAPS_KEY = "";

    function ensureMap() {
      if (map) return;
      map = L.map("map", { zoomControl: false, zoomSnap: 0.5 }).setView(home, 11);
      if (GOOGLE_MAPS_KEY) {
        L.tileLayer("https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&key=" + GOOGLE_MAPS_KEY, {
          maxZoom: 20,
          subdomains: ["mt0", "mt1", "mt2", "mt3"],
          attribution: "Google Maps"
        }).addTo(map);
      } else {
        // Clean, modern style — much smoother and less cluttered than raw OSM
        L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
          attribution: '&copy; OpenStreetMap &copy; CARTO',
          subdomains: "abcd",
          maxZoom: 20
        }).addTo(map);
      }
      layer = L.layerGroup().addTo(map);
    }
    function order(items) {
      const left = items.slice(1), out = [items[0]];
      const d = (a, b) => (a.lat - b.lat) ** 2 + ((a.lng - b.lng) * Math.cos(a.lat * Math.PI / 180)) ** 2;
      while (left.length) {
        const last = out[out.length - 1];
        let bi = 0;
        left.forEach((p, i) => { if (d(last, p) < d(last, left[bi])) bi = i; });
        out.push(left.splice(bi, 1)[0]);
      }
      return out;
    }
    const ll = p => p.lat + "," + p.lng;
    function routeLinks(stops) {
      const apple = "https://maps.apple.com/?saddr=" + ll(stops[0]) + stops.slice(1).map(p => "&daddr=" + ll(p)).join("") + "&dirflg=d";
      const mid = stops.slice(1, -1).map(ll).join("|");
      const google = "https://www.google.com/maps/dir/?api=1&origin=" + ll(stops[0]) + "&destination=" + ll(stops[stops.length - 1]) + (mid ? "&waypoints=" + encodeURIComponent(mid) : "") + "&travelmode=driving";
      return { apple, google };
    }
    function showRouteLinks(on) {
      ["appleRoute", "googleRoute"].forEach(id => document.getElementById(id).classList.toggle("hidden", !on));
    }
    document.getElementById("routeBtn").onclick = () => {
      const items = visible();
      if (items.length < 2) return;
      const stops = order(items);
      document.getElementById("mapScreen").classList.remove("hidden");
      ensureMap();
      setTimeout(() => map.invalidateSize(), 50);
      layer.clearLayers();
      L.polyline(stops.map(p => [p.lat, p.lng]), { color: "#e2a54a", weight: 4 }).addTo(layer);
      stops.forEach((p, i) => L.marker([p.lat, p.lng], { icon: L.divIcon({ className: "", html: "<div class=\"stop\">" + (i + 1) + "</div>", iconSize: [26, 26], iconAnchor: [13, 13] }) }).bindPopup((i + 1) + ". " + escapeHtml(p.name)).addTo(layer));
      map.fitBounds(L.latLngBounds(stops.map(p => [p.lat, p.lng])).pad(0.3));
      const links = routeLinks(stops);
      document.getElementById("appleRoute").href = links.apple;
      document.getElementById("googleRoute").href = links.google;
      showRouteLinks(true);
    };
    document.getElementById("mapBtn").onclick = () => {
      showRouteLinks(false);
      const items = visible();
      document.getElementById("mapScreen").classList.remove("hidden");
      ensureMap();
      setTimeout(() => map.invalidateSize(), 50);
      layer.clearLayers();
      items.forEach(p => L.circleMarker([p.lat, p.lng], { radius: 9, color: "#1a1408", weight: 2, fillColor: "#e2a54a", fillOpacity: 0.95 }).bindPopup(escapeHtml(p.name)).addTo(layer));
      if (items.length) map.fitBounds(L.latLngBounds(items.map(p => [p.lat, p.lng])).pad(0.3));
    };
    document.getElementById("closeMap").onclick = () => document.getElementById("mapScreen").classList.add("hidden");
    document.getElementById("tripFilter").onchange = render;
    render();
    (function shared() {
      const qs = new URLSearchParams(location.search);
      const parts = [qs.get("add"), qs.get("text"), qs.get("url")].filter(Boolean);
      if (!parts.length) return;
      let txt = [...new Set(parts)].join("\n");
      try { if (/%[0-9a-f]{2}/i.test(txt)) txt = decodeURIComponent(txt); } catch (e) {}
      history.replaceState(null, "", location.pathname + location.hash);
      document.getElementById("blob").value = txt.trim();
      find();
    })();
  </script>
</body>
